<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- redpen app icon — the margin mark.

       A paragraph of your writing with one word struck by the pen and the correction hanging off
       the elbow below. It is the app's own card as a picture: only the word that changed is marked
       (see the word-level diff in src/main.ts), because "a wall of green is not a rule you can
       carry to the next message".

       Geometry, both measured off a real macOS system icon rather than guessed:
         - the tile is a true superellipse |x/412|^5 + |y/412|^5 = 1, not a rounded rect
         - 824px across on a 1024 canvas
       The silhouette tracks Apple's to a 0.34px mean deviation at 256px. Tauri's `icon` command
       applies no mask of its own, so the shape has to be baked in here.

       Colour comes from the shipped card in src/styles.css: the removed/crimson token #b03a4a
       for the pen, the added/green token #0a7c3e for the fix. The struck word is crimson at 46% with a solid crimson stroke
       over it — the same "this word is marked" reading the card gives, and it survives to 64px.
       The elbow is a small tick, not a full L: at any real icon size a full elbow stops reading
       as an annotation and starts reading as the letter L.

       Detail is for 128px and up, which is where a Finder icon actually lives. Below 64px this
       resolves to warm paper with a red and a green mark — no Mac icon is legible at 16px, and
       the job there is a distinctive colour and silhouette, which this has. -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F2E6"/><stop offset="1" stop-color="#EDE3D2"/></linearGradient>
