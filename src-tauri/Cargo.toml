[package]
name = "redpen"
version = "0.1.0"
description = "Critique-only English coach for a Russian L1 writer"
authors = ["Roman Pronskiy"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name from colliding with the bin name on Windows.
name = "redpen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` is what puts redpen in the menu bar; without it TrayIconBuilder is absent.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
