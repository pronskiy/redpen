[package]
name = "redpen"
version = "0.1.0"
description = "Critique-only English coach for a Russian L1 writer"
authors = ["Roman Pronskiy"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name from colliding with the bin name on Windows.
name = "redpen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` is what puts redpen in the menu bar; without it TrayIconBuilder is absent.
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "default-tls"] }
futures-util = "0.3.34"
tokio = { version = "1.53.1", features = ["rt"] }

[target.'cfg(target_os = "macos")'.dependencies]
enigo = "0.6.1"
# Pinned to a commit, not a branch: this is the only way to get a non-activating NSPanel in
# Tauri, it is not on crates.io, and a moving branch under a load-bearing dependency is the
# risk the register calls out. Panel code stays isolated in panel.rs so a swap stays cheap.
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "c9ec2130422200f0863b23dfdad02b133a529b07" }
notify = "8.2.0"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
block2 = "0.6.2"
window-vibrancy = "0.8.0"
